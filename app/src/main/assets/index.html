<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>WebUniversalPlayer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #10141c;
      color: #f4f7fb;
      font-family: sans-serif;
      text-align: center;
    }
    main { padding: 4vw; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 5vw, 4rem); }
    p { margin: .5rem 0; color: #aab6c8; font-size: clamp(1rem, 2vw, 1.5rem); }
    .state { margin-top: 2rem; color: #83d6ad; }
  </style>
</head>
<body>
  <main>
    <h1>WebUniversalPlayer</h1>
    <p>Android TV 通用网页直播播放器</p>
    <p class="state">基础工程已就绪</p>
    <p>后续阶段将接入电视台直播网页与频道适配器</p>
  </main>
</body>
</html>
